[project]
name = "dash-on-flask"
version = "1.14.6"
description = "Dash apps integrated with Flask for CAVE neuroscience visualization"
requires-python = ">=3.10"
dependencies = [
    "flask",
    "dash",
    "dash-connectivity-viewer",
    "middle-auth-client>=3.11.1",
    "cell-search",
    "uwsgi",
]

[tool.uv]
# Not a distributable package — just a web app.
package = false


[dependency-groups]
dev = [
    "bump-my-version",
]

[tool.bumpversion]
current_version = "1.14.6"
commit = true
tag = true

[[tool.bumpversion.files]]
filename = "app/webapp.py"

[[tool.bumpversion.files]]
filename = "pyproject.toml"
search = 'version = "{current_version}"'
replace = 'version = "{new_version}"'
